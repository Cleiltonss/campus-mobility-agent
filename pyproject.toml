[project]
name = "assistente-reitoria"
version = "0.1.0"
description = "Assistente de dados da reitoria: transporte dos alunos (text-to-SQL + RAG)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary]>=3.2",
    "pydantic>=2.12",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistente"]

[tool.pytest.ini_options]
testpaths = ["tests"]
